<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login — AI Tutor</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'DM Sans', sans-serif;
    min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    background: #050510;
    color: #e8e8f0;
  }
  .orb { position: fixed; border-radius: 50%; filter: blur(80px); pointer-events: none; z-index: 0; }
  .orb-1 { width: 400px; height: 400px; background: radial-gradient(circle, #7c3aed33, transparent); top: -80px; left: -80px; }
  .orb-2 { width: 350px; height: 350px; background: radial-gradient(circle, #f5c84222, transparent); bottom: -60px; right: -60px; }

  .card {
    position: relative; z-index: 1;
    width: 400px; background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 24px; padding: 48px 40px;
    backdrop-filter: blur(20px);
    box-shadow: 0 40px 80px rgba(0,0,0,0.5);
    animation: slideUp 0.5s ease both;
  }
  @keyframes slideUp { from { opacity:0; transform:translateY(30px); } to { opacity:1; transform:translateY(0); } }

  .logo { text-align: center; font-family: 'Syne', sans-serif; font-size: 1.4rem; font-weight: 800; margin-bottom: 8px; }
  .logo span { color: #f5c842; }
  .subtitle { text-align: center; color: #6666aa; font-size: 0.88rem; margin-bottom: 36px; }

  label { display: block; font-size: 0.82rem; color: #9999cc; margin-bottom: 6px; font-weight: 500; }
  .field { margin-bottom: 20px; position: relative; }

  input {
    width: 100%; padding: 13px 16px;
    background: rgba(255,255,255,0.05);
    border: 1.5px solid rgba(255,255,255,0.1);
    border-radius: 12px; color: #e8e8f0;
    font-family: 'DM Sans', sans-serif; font-size: 0.95rem;
    outline: none; transition: border-color 0.2s, box-shadow 0.2s;
  }
  input:focus { border-color: #7c3aed; box-shadow: 0 0 0 3px rgba(124,58,237,0.15); }
  input::placeholder { color: #44446a; }

  .eye-btn {
    position: absolute; right: 14px; top: 50%; transform: translateY(-50%);
    background: none; border: none; cursor: pointer; font-size: 1.1rem; opacity: 0.6;
    transition: opacity 0.2s;
  }
  .eye-btn:hover { opacity: 1; }

  .btn-submit {
    width: 100%; padding: 14px;
    background: #f5c842; color: #000; font-weight: 700;
    font-family: 'Syne', sans-serif; font-size: 1rem;
    border: none; border-radius: 12px; cursor: pointer;
    box-shadow: 0 0 20px rgba(245,200,66,0.3);
    transition: all 0.2s; margin-top: 8px;
  }
  .btn-submit:hover { transform: translateY(-2px); box-shadow: 0 0 35px rgba(245,200,66,0.5); }

  .error-box {
    background: rgba(239,68,68,0.12); border: 1px solid rgba(239,68,68,0.3);
    border-radius: 10px; padding: 12px 16px; margin-bottom: 20px;
    color: #fca5a5; font-size: 0.88rem;
  }

  .footer-link { text-align: center; margin-top: 24px; font-size: 0.88rem; color: #6666aa; }
  .footer-link a { color: #f5c842; text-decoration: none; font-weight: 500; }
  .footer-link a:hover { text-decoration: underline; }

  .divider { text-align: center; color: #33334a; font-size: 0.8rem; margin: 20px 0; position: relative; }
  .divider::before, .divider::after { content: ''; position: absolute; top: 50%; width: 42%; height: 1px; background: rgba(255,255,255,0.06); }
  .divider::before { left: 0; } .divider::after { right: 0; }
</style>
</head>
<body>

<div class="orb orb-1"></div>
<div class="orb orb-2"></div>

<div class="card">
  <div class="logo">🤖 Adaptive <span>Learning Platform</span></div>
  <div class="subtitle">Welcome back — continue your journey</div>

  {% if error %}
  <div class="error-box">❌ {{ error }}</div>
  {% endif %}

  <form method="POST">
    <div class="field">
      <label>Username</label>
      <input type="text" name="username" placeholder="Enter your username" required autofocus>
    </div>
    <div class="field">
      <label>Password</label>
      <input type="password" id="pwd" name="password" placeholder="Enter your password" required>
      <button type="button" class="eye-btn" onclick="togglePwd()">👁</button>
    </div>
    <button type="submit" class="btn-submit">Login 🚀</button>
  </form>

  <div class="divider">or</div>

  <div class="footer-link">
    Don't have an account? <a href="{{ url_for('signup') }}">Create one free</a>
  </div>
</div>

<script>
function togglePwd() {
  const p = document.getElementById('pwd');
  p.type = p.type === 'password' ? 'text' : 'password';
}
</script>
</body>
</html>
